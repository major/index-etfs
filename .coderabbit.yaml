# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Inherits shared defaults from github.com/major/coderabbit.
inheritance: true

reviews:
  path_filters:
    - "!tickers/*.txt"
    - "!metadata/latest.json"

  path_instructions:
    - path: "src/index_etfs/holdings.py"
      instructions: |
        This repo downloads public ETF/index holdings and writes generated ticker files.
        Review provider parsing, ticker filtering, and count validation carefully. Keep the existing
        uv-packaged CLI shape; do not suggest a separate scripts runner or requirements.txt. Prefer
        stdlib urllib/json for simple JSON HTTP fetches unless a broader HTTP client is actually needed.
        Preserve dotted share-class tickers such as BRK.B.

    - path: "tests/**/*.py"
      instructions: |
        Tests should mock provider/network calls and assert generated file shape. Prefer small
        parametrized tests over broad fixture-heavy integration tests.

    - path: ".github/workflows/**"
      instructions: |
        The workflow refreshes generated holdings/ticker files and commits changes back to main.
        Verify pinned actions, least permissions, and that git add includes tickers/*.txt,
        metadata/*.json, and README.md without committing local caches.

    - path: "README.md"
      instructions: |
        README should keep ticker download instructions simple enough for non-developers.
